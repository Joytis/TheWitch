name: analytics

# Nightly refresh of the aggregate stats behind pages/analytics.html.
# Requires the SUPABASE_READ_KEY repository secret (Settings -> Secrets and
# variables -> Actions); value = contents of tools/analytics/supabase-service-key.local.txt.

on:
  schedule:
    - cron: "17 9 * * *" # daily, UTC, best-effort timing
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      # One export per character mod. The shared `runs` table carries a `character` column
      # (= uploading mod id; tools/analytics/migrations/001_character_column.sql, applied
      # 2026-09-20 — pre-existing rows defaulted to TheWitch). The Witch keeps writing the
      # page's root folder pages/analytics-data/; every other character writes
      # pages/analytics-data/<key>/.
      - name: Export aggregate stats (Witch)
        env:
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
        run: python tools/analytics/export_stats.py --character TheWitch --out-dir pages/analytics-data

      - name: Export aggregate stats (Augur)
        env:
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
        run: python tools/analytics/export_stats.py --character TheAugur --out-dir pages/analytics-data/augur

      - name: Commit if changed
        run: |
          git add pages/analytics-data
          if git diff --staged --quiet; then
            echo "Stats unchanged - nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Analytics: refresh aggregate stats"
            git pull --rebase
            git push
          fi
